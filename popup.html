<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoSpoof Pro</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="app">
  <header>
    <div class="logo">◎</div>
    <div>
      <h1>GeoSpoof Pro</h1>
      <p>Custom browser location</p>
    </div>
  </header>

  <div class="card">
    <label>Latitude</label>
    <input id="lat" type="number" step="any" placeholder="22.3072">

    <label>Longitude</label>
    <input id="lon" type="number" step="any" placeholder="73.1812">

    <label>Accuracy (meters)</label>
    <input id="acc" type="number" min="0.1" step="0.1" value="10">

    <button id="apply">📍 Apply to Active Tab</button>
    <button id="clear" class="secondary">Disable / Clear</button>

    <div id="status">Ready</div>
  </div>

  <div class="presets">
    <b>Quick presets</b>
    <button class="preset" data-lat="23.0225" data-lon="72.5714">Ahmedabad</button>
    <button class="preset" data-lat="22.3072" data-lon="73.1812">Vadodara</button>
    <button class="preset" data-lat="21.1702" data-lon="72.8311">Surat</button>
    <button class="preset" data-lat="22.2587" data-lon="71.1924">Gujarat Center</button>
  </div>

  <p class="note">
    Uses Chrome's native geolocation emulation. It does not change your IP address.
  </p>
  <p class="note">
   This is Generated by <b> YUVRAJSINH S. THAKOR</b>
  </p>
</div>
<script src="popup.js"></script>
</body>
</html>
